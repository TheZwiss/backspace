app-id: io.github.TheZwiss.backspace
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: backspace
separate-locales: false

finish-args:
  # Chromium requires a shared IPC namespace for its multi-process model.
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Hardware-accelerated rendering and direct webcam access. Screen capture is
  # mediated by the desktop portals.
  - --device=all
  # Electron's Linux tray uses StatusNotifier and its Notification API talks
  # directly to the freedesktop notification service. Screen capture remains
  # mediated by the XDG desktop portal.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Chromium uses UPower to observe battery state. Grant only that service
  # instead of exposing the complete system bus.
  - --system-talk-name=org.freedesktop.UPower
  # Keep pointer themes correctly scaled when Electron uses native Wayland.
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: backspace
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin
      # Electron binaries are already stripped. Disabling Flatpak's separate
      # debuginfo pass also avoids trying to mirror deeply nested asar-unpacked
      # native-module paths into /app/lib/debug.
      no-debuginfo: true
    sources:
      # Application source and dependency lockfile. Keep this commit in sync
      # with flatpak/node-sources.json when updating the package.
      - type: git
        url: https://github.com/TheZwiss/backspace.git
        commit: f69d22b3c8b0ddd66048c7a0198d97ea9fc782c0

      # Offline pnpm store, Electron archives, native package prebuilts, and
      # Node headers generated from the pinned pnpm-lock.yaml.
      - flatpak/node-sources.json

      # Corepack normally downloads pnpm on first use, which is forbidden in
      # Flatpak's network-isolated build sandbox. Ship the pinned CLI instead.
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-10.34.3.tgz
        sha256: 1c40544020a2e633068ed43a98eb5c0fed7d64a1c6d6f2382e43df91419dad62
        strip-components: 1
        dest: flatpak-pnpm

      - type: file
        path: flatpak/build.sh

      - type: file
        path: flatpak/io.github.TheZwiss.backspace.desktop

      - type: file
        path: flatpak/io.github.TheZwiss.backspace.metainfo.xml

      - type: script
        dest-filename: backspace
        commands:
          - export TMPDIR="${XDG_RUNTIME_DIR}/app/${FLATPAK_ID}"
          - exec zypak-wrapper /app/backspace/Backspace "$@"

    build-commands:
      - /bin/sh build.sh
