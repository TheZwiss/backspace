# gated behind the tailwindcss 4 port in the Dependabot table.
[[IgnoredVulns]]
id = "CVE-2026-104844"
ignoreUntil = 2026-12-01
reason = "postcss-selector-parser 6.1.4, fixed in 7.1.6 only. Build-time only via tailwindcss 3, which does not accept 7.x."

