# Five more fastify 4.29.1 findings, fixed in 5.12.2 (5.12.5 for the HTTP/2
# trailer one). Same major upgrade as above. None of the five reaches this
# server as it is written: it does not enable http2 or call reply.trailer(),
# uses no $async schema, no header schema with the `dependencies` keyword and no
# `false` request-part schema, and registers a single root-level not-found
# handler (the SPA fallback) with no auth hook to skip.
[[IgnoredVulns]]
id = "CVE-2026-92081"
ignoreUntil = 2026-12-01
reason = "fastify 4.29.1, fixed in 5.12.5. Needs http2 plus reply.trailer(); the server uses neither. Major upgrade, tracked in security-scanning.md."

[[IgnoredVulns]]
id = "CVE-2026-84504"
ignoreUntil = 2026-12-01
reason = "fastify 4.29.1, fixed in 5.12.2. Needs an $async request schema; the server has none. Major upgrade, tracked in security-scanning.md."

[[IgnoredVulns]]
id = "CVE-2026-84428"
ignoreUntil = 2026-12-01
reason = "fastify 4.29.1, fixed in 5.12.2. Needs a header schema using `dependencies`; the server has none. Major upgrade, tracked in security-scanning.md."

[[IgnoredVulns]]
id = "CVE-2026-84469"
ignoreUntil = 2026-12-01
reason = "fastify 4.29.1, fixed in 5.12.2. Needs a `false` request-part schema; the server has none. Major upgrade, tracked in security-scanning.md."

[[IgnoredVulns]]
id = "CVE-2026-76169"
ignoreUntil = 2026-12-01
reason = "fastify 4.29.1, fixed in 5.12.2. Needs encapsulated not-found handlers behind auth; the server has one root-level SPA fallback. Major upgrade, tracked in security-scanning.md."

