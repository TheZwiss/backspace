# glob 10.5.0 and 11.1.0 -> 14.0.2. The advisory is an AbortSignal cancellation
# bypass: filesystem work continues after the signal fires. glob 11.1.0 is
# build-time only (workbox-build under vite-plugin-pwa). glob 10.5.0 is the
# runtime copy under @fastify/static 7, which never passes a signal to glob and
# takes its patterns from server code, never from a request. Moving to 14 means
# the fastify 5 upgrade that already gates @fastify/static.
[[IgnoredVulns]]
id = "CVE-2026-118773"
ignoreUntil = 2026-12-01
reason = "glob 10.5.0 and 11.1.0, fixed in 14.0.2 only. The server never passes an AbortSignal to glob; the other copy is build-time. Gated behind the fastify 5 upgrade."

# minimatch 9.0.9 and 10.2.6 -> 11.0.1. Denial of service through globparts
# amplification, reachable only with an attacker-chosen pattern. 9.0.9 is under
# glob 10.5.0 (@fastify/static 7, patterns come from server code) and under
# @electron/universal in electron-builder (packaging). 10.2.6 is ESLint's. None
# matches a pattern a user supplies, and no 9.x or 10.x release carries the fix.
[[IgnoredVulns]]
id = "CVE-2026-118764"
ignoreUntil = 2026-12-01
reason = "minimatch 9.0.9 and 10.2.6, fixed in 11.0.1 only. Patterns come from server code or build tooling, never from users. Gated behind the fastify 5 upgrade."
