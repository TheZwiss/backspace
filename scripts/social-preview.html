<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Backspace social preview</title>
<style>
  /*
   * Rendered standalone at exactly 1280x640 by gen-social-preview.mjs — see
   * that script for how {{MARK_SVG}}, {{FABIO_XM_DATA_URI}} and
   * {{DM_SANS_DATA_URI}} get substituted before Chrome opens this file.
   * Everything here is self-contained on purpose: no external font or
   * image fetches, because Chrome over file:// does not perform them.
   */
  @font-face {
    font-family: "Fabio XM";
    src: url("{{FABIO_XM_DATA_URI}}") format("truetype");
    font-weight: 400 500;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "DM Sans";
    src: url("{{DM_SANS_DATA_URI}}") format("woff2");
    font-weight: 100 1000;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
  }

  body {
    /* Navy gradient from the app icon (navyGradientSvg in gen-icons.mjs),
       top to bottom, not the site's own --site-bg-gradient — the brief
       calls for the icon's ground specifically. */
    background: linear-gradient(180deg, #2e3d65 0%, #110222 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .mark {
    width: 204px;
    height: 276px;
    flex: none;
  }

  .mark svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .wordmark {
    margin-top: 40px;
    font-family: "Fabio XM", "DM Sans", sans-serif;
    font-weight: 500;
    font-size: 88px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #f5f5f7;
  }

  .tagline {
    margin-top: 24px;
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 460;
    font-size: 32px;
    line-height: 1.4;
    letter-spacing: -0.005em;
    color: #b7b7c3;
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="mark">{{MARK_SVG}}</div>
    <div class="wordmark">Backspace</div>
    <div class="tagline">Group chat that lives on your own hardware.</div>
  </div>
</body>
</html>
