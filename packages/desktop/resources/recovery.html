<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Backspace — Recovery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #13131a;
      color: #efefef;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    body { display: flex; flex-direction: column; }

    .titlebar {
      height: 32px;
      min-height: 32px;
      background: #0b0b10;
      -webkit-app-region: drag;
      position: relative;
      z-index: 100;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2rem 2rem;
    }

    .container {
      -webkit-app-region: no-drag;
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: #1a1a23;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.24);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
    }

    .hint {
      font-size: 0.875rem;
      color: #a0a0aa;
      margin: 0 0 1.5rem 0;
      line-height: 1.5;
    }

    .check-result {
      font-size: 0.8125rem;
      margin: 0.5rem 0 0 0;
      min-height: 1em;
    }
    .check-result.up-to-date { color: #84cc8b; }
    .check-result.failed { color: #f0a05a; }

    .actions { display: flex; flex-direction: column; gap: 0.5rem; }

    button.action {
      width: 100%;
      padding: 0.625rem 1rem;
      background: #2a2a33;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      color: #efefef;
      font-family: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.action:hover:not(:disabled) { background: #34343f; }
    button.action:disabled { opacity: 0.5; cursor: default; }
    button.action.primary { background: #7c6cf6; border-color: transparent; }
    button.action.primary:hover { background: #8a7df8; }
    button.action.subtle {
      background: transparent;
      color: #a0a0aa;
      border: none;
      padding-top: 0.375rem;
      padding-bottom: 0.375rem;
      font-size: 0.8125rem;
    }
    button.action.subtle:hover { color: #efefef; background: transparent; }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 1.25rem 0;
    }

    details {
      font-size: 0.8125rem;
      color: #a0a0aa;
    }
    details summary {
      cursor: pointer;
      user-select: none;
      padding: 0.25rem 0;
    }
    details pre {
      margin: 0.5rem 0 0 0;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="content">
    <div class="container">
      <div class="card">
        <h1 data-i18n="title">Backspace couldn't load.</h1>
        <p class="hint" id="hint" data-i18n="loading">Loading…</p>

        <div class="actions">
          <button class="action primary" id="btn-reload" data-i18n="reload">Reload</button>
          <button class="action" id="btn-restart" style="display:none" data-i18n="restartToInstall">Restart to Install Update</button>
          <button class="action" id="btn-check" data-i18n="checkForUpdates">Check for Updates</button>
          <p class="check-result" id="check-result"></p>
          <button class="action" id="btn-change" data-i18n="changeInstance">Change Instance</button>
          <button class="action" id="btn-releases" style="display:none" data-i18n="openReleases">Open Releases Page</button>
        </div>

        <div class="divider"></div>

        <details>
          <summary data-i18n="diagnostics">Diagnostic info</summary>
          <pre id="diagnostic">loading…</pre>
        </details>

        <button class="action subtle" id="btn-quit" data-i18n="quit">Quit Backspace</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);

    // Strings for the three shipped languages. The main process passes the
    // language as ?lang= when it loads this page, because this page is shown
    // precisely when the renderer (and its catalogs) is unavailable. Keep in
    // step with packages/desktop/src/l10n.ts and the web `desktop` namespace.
    const STRINGS = {
      en: {
        title: "Backspace couldn't load.",
        loading: 'Loading…',
        reload: 'Reload',
        restartToInstall: 'Restart to Install Update',
        checkForUpdates: 'Check for Updates',
        checking: 'Checking…',
        downloading: 'Downloading Update…',
        updateReady: 'Update Ready',
        updateAvailable: 'Update Available',
        updatesExternal: 'Updates Managed by Flatpak',
        changeInstance: 'Change Instance',
        openReleases: 'Open Releases Page',
        downloadVersion: 'Download Backspace {version}',
        downloadUpdate: 'Download the Update',
        diagnostics: 'Diagnostic info',
        quit: 'Quit Backspace',
        upToDate: "You're up to date",
        checkFailed: 'Update check failed',
        bridgeUnavailable: 'Recovery bridge unavailable. Please quit and reinstall Backspace.',
        stateLoadFailed: 'Failed to load recovery state: {message}',
        hintExternal: 'Try reloading the app or changing the connected instance. Updates are managed by Flatpak.',
        hintLoadFailed: "Couldn't reach your instance. Check your connection or try a different instance.",
        hintCrashReady: 'Something inside the app failed. An update is ready, so click Restart to Install.',
        hintCrashManual: 'Something inside the app failed. A newer version is available, but this build cannot install it itself. Download it and replace the app.',
        hintCrashDownloading: 'Something inside the app failed. An update is downloading, so wait for it to finish and then restart.',
        hintCrash: 'Something inside the app failed. Try reloading or check for an update.',
        hintStalledReady: "The app didn't finish loading. An update is ready, so click Restart to Install.",
        hintStalledManual: "The app didn't finish loading. A newer version is available, but this build cannot install it itself. Download it and replace the app.",
        hintStalledDownloading: "The app didn't finish loading. An update is downloading, so wait for it to finish and then restart.",
        hintStalled: "The app didn't finish loading in time. Try reloading, or check for an update if reloading doesn't help.",
        hintGeneric: 'Something went wrong. Try reloading.',
      },
      ru: {
        title: 'Backspace не удалось загрузить.',
        loading: 'Загрузка…',
        reload: 'Перезагрузить',
        restartToInstall: 'Перезапустить для установки',
        checkForUpdates: 'Проверить обновления',
        checking: 'Проверка…',
        downloading: 'Загрузка обновления…',
        updateReady: 'Обновление готово',
        updateAvailable: 'Доступно обновление',
        updatesExternal: 'Обновлениями управляет Flatpak',
        changeInstance: 'Сменить сервер',
        openReleases: 'Открыть страницу релизов',
        downloadVersion: 'Скачать Backspace {version}',
        downloadUpdate: 'Скачать обновление',
        diagnostics: 'Диагностика',
        quit: 'Выйти из Backspace',
        upToDate: 'У вас последняя версия',
        checkFailed: 'Не удалось проверить обновления',
        bridgeUnavailable: 'Режим восстановления недоступен. Закройте Backspace и переустановите приложение.',
        stateLoadFailed: 'Не удалось загрузить состояние восстановления: {message}',
        hintExternal: 'Попробуйте перезагрузить приложение или сменить сервер. Обновлениями управляет Flatpak.',
        hintLoadFailed: 'Не удалось связаться с сервером. Проверьте подключение или попробуйте другой сервер.',
        hintCrashReady: 'В приложении произошёл сбой. Обновление готово, нажмите «Перезапустить для установки».',
        hintCrashManual: 'В приложении произошёл сбой. Доступна новая версия, но эта сборка не может установить её сама. Скачайте её и замените приложение.',
        hintCrashDownloading: 'В приложении произошёл сбой. Обновление загружается, дождитесь окончания и перезапустите приложение.',
        hintCrash: 'В приложении произошёл сбой. Попробуйте перезагрузить его или проверить обновления.',
        hintStalledReady: 'Приложение не завершило загрузку. Обновление готово, нажмите «Перезапустить для установки».',
        hintStalledManual: 'Приложение не завершило загрузку. Доступна новая версия, но эта сборка не может установить её сама. Скачайте её и замените приложение.',
        hintStalledDownloading: 'Приложение не завершило загрузку. Обновление загружается, дождитесь окончания и перезапустите приложение.',
        hintStalled: 'Приложение не загрузилось вовремя. Попробуйте перезагрузить его, а если не поможет, проверьте обновления.',
        hintGeneric: 'Что-то пошло не так. Попробуйте перезагрузить.',
      },
      de: {
        title: 'Backspace konnte nicht geladen werden.',
        loading: 'Wird geladen…',
        reload: 'Neu laden',
        restartToInstall: 'Neu starten und Update installieren',
        checkForUpdates: 'Nach Updates suchen',
        checking: 'Suche…',
        downloading: 'Update wird heruntergeladen…',
        updateReady: 'Update bereit',
        updateAvailable: 'Update verfügbar',
        updatesExternal: 'Updates werden von Flatpak verwaltet',
        changeInstance: 'Instanz wechseln',
        openReleases: 'Release-Seite öffnen',
        downloadVersion: 'Backspace {version} herunterladen',
        downloadUpdate: 'Update herunterladen',
        diagnostics: 'Diagnose',
        quit: 'Backspace beenden',
        upToDate: 'Du bist auf dem neuesten Stand',
        checkFailed: 'Update-Prüfung fehlgeschlagen',
        bridgeUnavailable: 'Der Wiederherstellungsmodus ist nicht verfügbar. Beende Backspace und installiere es neu.',
        stateLoadFailed: 'Wiederherstellungsstatus konnte nicht geladen werden: {message}',
        hintExternal: 'Lade die App neu oder wechsle die Instanz. Updates werden von Flatpak verwaltet.',
        hintLoadFailed: 'Deine Instanz war nicht erreichbar. Prüfe deine Verbindung oder versuche eine andere Instanz.',
        hintCrashReady: 'In der App ist etwas fehlgeschlagen. Ein Update ist bereit, klicke auf „Neu starten und Update installieren“.',
        hintCrashManual: 'In der App ist etwas fehlgeschlagen. Eine neuere Version ist verfügbar, aber dieser Build kann sie nicht selbst installieren. Lade sie herunter und ersetze die App.',
        hintCrashDownloading: 'In der App ist etwas fehlgeschlagen. Ein Update wird heruntergeladen, warte, bis es fertig ist, und starte dann neu.',
        hintCrash: 'In der App ist etwas fehlgeschlagen. Lade neu oder suche nach einem Update.',
        hintStalledReady: 'Die App wurde nicht fertig geladen. Ein Update ist bereit, klicke auf „Neu starten und Update installieren“.',
        hintStalledManual: 'Die App wurde nicht fertig geladen. Eine neuere Version ist verfügbar, aber dieser Build kann sie nicht selbst installieren. Lade sie herunter und ersetze die App.',
        hintStalledDownloading: 'Die App wurde nicht fertig geladen. Ein Update wird heruntergeladen, warte, bis es fertig ist, und starte dann neu.',
        hintStalled: 'Die App wurde nicht rechtzeitig geladen. Lade neu, oder suche nach einem Update, wenn das nicht hilft.',
        hintGeneric: 'Etwas ist schiefgelaufen. Lade neu.',
      },
    };
    const LANG = new URLSearchParams(window.location.search).get('lang');
    const T = STRINGS[LANG] || STRINGS.en;
    document.documentElement.lang = STRINGS[LANG] ? LANG : 'en';
    function t(key, vars) {
      const text = T[key] || STRINGS.en[key] || key;
      return vars ? text.replace(/\{(\w+)\}/g, (m, name) => (name in vars ? vars[name] : m)) : text;
    }
    for (const el of document.querySelectorAll('[data-i18n]')) {
      el.textContent = t(el.getAttribute('data-i18n'));
    }

    function hintFor(reasonCode, updateState) {
      if (updateState === 'external') return t('hintExternal');
      if (reasonCode === 'load-failed') return t('hintLoadFailed');
      if (reasonCode === 'render-gone' || reasonCode === 'unresponsive') {
        if (updateState === 'downloaded') return t('hintCrashReady');
        if (updateState === 'available-manual') return t('hintCrashManual');
        if (updateState === 'downloading') return t('hintCrashDownloading');
        return t('hintCrash');
      }
      if (reasonCode === 'renderer-stalled') {
        if (updateState === 'downloaded') return t('hintStalledReady');
        if (updateState === 'available-manual') return t('hintStalledManual');
        if (updateState === 'downloading') return t('hintStalledDownloading');
        return t('hintStalled');
      }
      return t('hintGeneric');
    }

    function checkButtonLabel(updateState) {
      switch (updateState) {
        case 'external': return t('updatesExternal');
        case 'checking': return t('checking');
        case 'downloading': return t('downloading');
        case 'downloaded': return t('updateReady');
        case 'available-manual': return t('updateAvailable');
        case 'error': return t('checkForUpdates');
        case 'idle':
        default: return t('checkForUpdates');
      }
    }

    function checkButtonEnabled(updateState) {
      if (updateState === 'external') return false;
      return updateState !== 'checking'
        && updateState !== 'downloading'
        && updateState !== 'downloaded'
        && updateState !== 'available-manual';
    }

    function checkResultText(lastCheckResult) {
      if (lastCheckResult === 'up-to-date') return t('upToDate');
      if (lastCheckResult === 'failed') return t('checkFailed');
      return '';
    }

    async function getVersion() {
      try {
        if (typeof window.backspace?.getVersion === 'function') {
          return await window.backspace.getVersion();
        }
      } catch {}
      return 'unknown';
    }

    let cachedVersion = 'loading…';
    // Populated in init() via Promise.all alongside getRecoveryState.

    function render(state) {
      const reasonCode = state.reason?.code ?? null;
      $('hint').textContent = hintFor(reasonCode, state.updateState);

      // Check for Updates button
      $('btn-check').textContent = checkButtonLabel(state.updateState);
      $('btn-check').disabled = !checkButtonEnabled(state.updateState);
      $('btn-check').style.display = state.updateState === 'external' ? 'none' : '';

      // Restart visibility. Only ever shown when the update is genuinely staged
      // and installable, so this surface can never present a dead button.
      $('btn-restart').style.display = state.updateState === 'downloaded' ? '' : 'none';

      // Open Releases visibility. Shown after a failed update, and on builds
      // that cannot install in place, where downloading is the only real action.
      const manual = state.updateState === 'available-manual';
      $('btn-releases').style.display = (state.updateState === 'error' || manual) ? '' : 'none';
      $('btn-releases').textContent = manual
        ? (state.updateVersion ? t('downloadVersion', { version: state.updateVersion }) : t('downloadUpdate'))
        : t('openReleases');

      // Inline check result
      const cr = $('check-result');
      cr.textContent = checkResultText(state.lastCheckResult);
      cr.className = 'check-result' + (state.lastCheckResult ? ' ' + state.lastCheckResult : '');

      // Diagnostic info
      const lines = [];
      lines.push('Version: ' + cachedVersion);
      if (state.reason) lines.push('Reason: ' + state.reason.code + ' (' + state.reason.detail + ')');
      if (state.updateVersion) lines.push('Update version: ' + state.updateVersion);
      if (state.lastUpdateError) {
        lines.push('Last update error: ' + state.lastUpdateError.message);
        if (state.lastUpdateError.code) lines.push('Error code: ' + state.lastUpdateError.code);
      }
      $('diagnostic').textContent = lines.join('\n');
    }

    function dispatch(action) {
      if (typeof window.backspace?.recoveryAction === 'function') {
        window.backspace.recoveryAction(action);
      }
    }

    $('btn-reload').onclick = () => dispatch('reload');
    $('btn-restart').onclick = () => dispatch('install-update');
    $('btn-check').onclick = () => dispatch('check-update');
    $('btn-change').onclick = () => dispatch('change-instance');
    $('btn-releases').onclick = () => dispatch('open-releases');
    $('btn-quit').onclick = () => dispatch('quit');

    // Cmd/Ctrl+R as keyboard shortcut for Reload
    window.addEventListener('keydown', (e) => {
      const meta = e.metaKey || e.ctrlKey;
      if (meta && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        dispatch('reload');
      }
    });

    async function init() {
      if (!window.backspace) {
        $('hint').textContent = t('bridgeUnavailable');
        return;
      }
      try {
        // Resolve both in parallel so the first render has the version string
        // (otherwise the diagnostic block briefly shows "Version: loading…").
        const [initial, version] = await Promise.all([
          window.backspace.getRecoveryState(),
          getVersion(),
        ]);
        cachedVersion = version;
        render(initial);
      } catch (err) {
        $('hint').textContent = t('stateLoadFailed', { message: err && err.message ? err.message : String(err) });
        return;
      }
      window.backspace.onRecoveryStateChanged((state) => {
        render(state);
      });
    }
    init();
  </script>
</body>
</html>
