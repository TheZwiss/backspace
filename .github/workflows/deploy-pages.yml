name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/metrics/**' # a bundler change must redeploy, or the site silently serves stale data
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  # Called by metrics.yml after a successful collection, so the dashboard
  # publishes the day it is collected instead of waiting for the next push to
  # `site/**`. One constraint the caller owns, not this file: permissions in a
  # called workflow are the intersection of what the caller grants and what is
  # declared below — they can be reduced, never elevated — so the calling job
  # must grant `pages: write` and `id-token: write` itself, or the deploy fails
  # on a missing scope.
  #
  # The `pages` concurrency group and the job timeout both live on the `deploy`
  # job below rather than at workflow level, so they apply identically however
  # this workflow is reached. GitHub's docs do not state whether a
  # workflow-level `concurrency` is honoured for a `workflow_call` invocation;
  # putting the group on the job removes the need for an answer instead of
  # betting on one.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Declared on the job, not at workflow level, because this workflow is
    # reached two ways and the group has to hold on both. `deploy` is the only
    # job here, so for the push path a job-level group serialises exactly what a
    # workflow-level one did; for the `workflow_call` path it is the only form
    # the docs describe. Keeping both would put one group on a run and on a job
    # inside that run, and nothing documents whether those two contend with each
    # other — an avoidable question with no upside.
    concurrency:
      group: pages
      # Do NOT cancel in-progress runs: this is a production deploy. Cancelling
      # actions/deploy-pages mid-flight strands a deployment in the github-pages
      # environment and blocks the next one from proceeding.
      cancel-in-progress: false
    # A ceiling, not a target: a normal run is 1-2 minutes, and
    # actions/deploy-pages self-limits its own wait for the Pages build at 10.
    # It matters because metrics.yml calls this workflow from inside a run that
    # holds the `metrics-data` group for its whole duration — GitHub's 6-hour
    # default would let one stalled deploy hold that group deep into the next
    # day, and since only one run per group stays pending, delay and then drop a
    # scheduled collection. Traffic data GitHub has already discarded cannot be
    # collected later.
    #
    # Two limits of this ceiling, stated so they are not rediscovered as
    # surprises. It bounds job EXECUTION, so it does not bound a wait at the
    # `github-pages` environment gate — an approval rule or wait timer there can
    # hold the run, and the `metrics-data` group with it, for far longer. And a
    # timeout cancels the job, which is the same stranding the `cancel-in-progress:
    # false` note above exists to avoid; if a deploy ever hits this ceiling, check
    # the environment for a stuck in-progress deployment before re-running. Both
    # are accepted: a bounded chance of a stranded deploy beats an unbounded
    # chance of a dropped collection.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # This runs on every `site/**` push, whether or not the archive branch
      # exists — so its existence is probed here and the checkout below is gated
      # on the answer. `actions/checkout` asked for a ref that does not exist
      # hard-fails, and no `if:` inside that step can rescue it, so the test has
      # to happen before it: an unconditional checkout would break every
      # landing-page deploy until the branch is created, and permanently again
      # if it is ever deleted.
      #
      # `git ls-remote origin` rather than a `gh api` call against a repo slug:
      # `origin` is whatever the checkout above cloned, so this stays correct if
      # the project is renamed or transferred, and it needs no token handling.
      #
      # THREE outcomes, not two. `--exit-code` returns 2 for "talked to the
      # remote, found no such branch" and 128 for "could not talk to the remote"
      # — a network blip, an auth failure, a renamed remote. Collapsing those
      # two into one `else` would publish a blank dashboard over a live archive
      # and log that the branch does not exist, which is a lie the run would
      # carry all the way to the page. Absent is a fact and gets the empty
      # state; anything else is an unknown and fails the job, with git's own
      # error text kept rather than sunk into /dev/null. Same reasoning as
      # cli-bundle.ts, which treats ENOENT as empty and every other errno as
      # fatal: a blank dashboard published over data that exists is
      # indistinguishable, on the page, from a repo with no traffic.
      - name: Check for the metrics archive branch
        id: archive
        run: |
          set -euo pipefail
          status=0
          output=$(git ls-remote --exit-code --heads origin metrics-data 2>&1) || status=$?
          case "$status" in
            0)
              echo 'present=true' >> "$GITHUB_OUTPUT"
              echo 'metrics-data found — bundling the dashboard from the archive'
              ;;
            2)
              echo 'present=false' >> "$GITHUB_OUTPUT"
              echo '::notice::metrics-data does not exist — publishing the dashboard empty state'
              ;;
            *)
              printf '%s\n' "$output" >&2
              echo "::error::git ls-remote could not reach origin (exit status $status). Refusing to treat this as an absent branch: that would publish an empty dashboard over an archive that probably exists."
              exit 1
              ;;
          esac

      - name: Checkout the metrics archive
        if: steps.archive.outputs.present == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: metrics-data
          path: .metrics-data

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Pinned to 24 to match metrics.yml: the bundler is TypeScript executed
          # directly by Node's native type stripping, with no build step and no
          # dependencies.
          node-version: 24
          # This job never installs anything, so there is no dependency cache to
          # prime. Left at its default, setup-node detects the repo's pnpm from
          # the root package.json and fails the step trying to invoke it, because
          # nothing here installs pnpm the way ci.yml does.
          package-manager-cache: false

      # Unconditional, unlike the checkout above. A missing archive directory is
      # the empty case, not a failure: cli-bundle.ts writes a valid, complete
      # data.json and exits 0, and the page renders its empty state from it. An
      # archive that exists but is corrupt or unreadable still exits non-zero and
      # fails the deploy, which is correct — a blank dashboard published over
      # data that exists is indistinguishable, on the page, from no traffic.
      #
      # Both paths are absolute, matching metrics.yml: METRICS_OUTPUT_PATH is a
      # file path resolved against the process CWD, and the CLI creates its
      # parent directory recursively.
      - name: Bundle the metrics archive
        env:
          METRICS_DATA_DIR: ${{ github.workspace }}/.metrics-data
          METRICS_OUTPUT_PATH: ${{ github.workspace }}/site/insights/data.json
        run: node scripts/metrics/src/cli-bundle.ts

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # ./site now carries insights/data.json, written by the step above into the
      # workspace (it is gitignored, so it exists only for the length of a run).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
