name: Flatpak

on:
  pull_request:
    paths:
      - '.github/workflows/flatpak.yml'
      - 'flatpak/**'
      - 'io.github.TheZwiss.backspace.yml'
      - 'packages/desktop/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/flatpak.yml'
      - 'flatpak/**'
      - 'io.github.TheZwiss.backspace.yml'
      - 'packages/desktop/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:68c521931eccf47dfa05c1c80f43be0993cce516417a633aa34913707da57cf2
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Lint manifest
        run: |
          flatpak-builder-lint manifest io.github.TheZwiss.backspace.yml
          flatpak-builder-lint appstream flatpak/io.github.TheZwiss.backspace.metainfo.xml

      - name: Build and validate
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: io.github.TheZwiss.backspace.yml
          build-bundle: false
          upload-artifact: false
          mirror-screenshots-url: https://dl.flathub.org/media/
          cache-key: flatpak-builder-${{ github.sha }}
