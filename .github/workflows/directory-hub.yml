name: Directory hub

# Tests and deploys the Cloudflare Worker at scripts/directory-hub, the space
# directory instances that opted in ping and every instance's Explore page
# reads. See docs/systems/directory.md.
#
# The hub is a workspace package, so ci.yml's `pnpm -r test` already runs
# its suite on both Node legs. This file exists for what ci.yml cannot do: give
# the package a fast, path-filtered check of its own, and give it a way to be
# published. It is not part of `pnpm build` and it is not in the Docker image.
#
# Two jobs, deliberately split by trigger:
#
# - `test` runs on every push to main and every pull request that touches the
#   package or this file. It holds no secrets, so it is safe on a fork.
# - `deploy` runs only when Jannis dispatches it by hand from main. Nothing
#   about a merge deploys the hub. The D1 database, the GitHub environment
#   `directory-hub` and the explore.backspacechat.com custom domain are set up
#   once by hand (docs/systems/directory.md), and a live endpoint the whole
#   opted-in fleet pings should be republished when someone decides to, not as
#   a side effect of an unrelated merge. This job creates nothing: it applies
#   the migrations already in the repository and publishes the Worker.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/directory-hub/**'
      - '.github/workflows/directory-hub.yml'
  pull_request:
    paths:
      - 'scripts/directory-hub/**'
      - '.github/workflows/directory-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directory-hub-${{ github.ref }}
  # A superseded pull-request run is worth cancelling. A dispatched deploy is
  # not, and it shares this group with pushes to main: cancelling it between
  # the migration step and the deploy step would leave the live database
  # migrated and the Worker not, with no record of which half ran.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test the hub
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      # .nvmrc, which is 24, rather than the repository's `engines.node` floor
      # of 22.12. ci.yml's `pnpm -r test` picks this package up on both matrix
      # legs, so the floor is covered there. The job below runs wrangler
      # against the live account, and wrangler and miniflare declare
      # `engines.node: ">=22.0.0"`; pinning the version the deploy actually
      # uses means a wrangler bump that needs a newer Node breaks a pull
      # request rather than a deploy.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Filtered: this workflow never needs the server, web or desktop trees,
      # and the desktop package's native postinstall rebuild is pure cost here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @backspace/directory-hub

      - name: Typecheck
        run: pnpm --filter @backspace/directory-hub typecheck

      - name: Test
        run: pnpm --filter @backspace/directory-hub test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    # Dispatch only, from the default branch only, never on a fork. The fork
    # guard is not redundant with the secrets being absent there: without it a
    # fork owner dispatching this workflow gets a run that reaches Cloudflare
    # with an empty token and fails on their account rather than declining to
    # start.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    # Scopes CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this one job and
    # gives the deploy somewhere to hang an approval or a branch policy later.
    # No extra `permissions:` is needed for it: the deployment record is
    # written by the runner, not by GITHUB_TOKEN.
    environment: directory-hub
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Installs the wrangler the lockfile resolves for this package. Both steps
      # below then find it already present and use it: wrangler-action falls
      # back to installing its own default (3.90.0, a major behind) only when it
      # cannot find one, and wrangler.toml here is a wrangler 4 config.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @backspace/directory-hub

      # Applies the migration files under scripts/directory-hub/migrations
      # to the database `database_id` in wrangler.toml names, which was created
      # by hand once. This step provisions nothing; it runs SQL files that are
      # already in the repository, and D1 records which of them have run, so
      # re-running it is a no-op. Before the deploy, so the schema is never
      # behind the code that reads it.
      #
      # `packageManager` is set explicitly because wrangler-action infers it
      # from a lockfile in workingDirectory, and in a pnpm workspace the
      # lockfile lives at the root, so it would otherwise fall back to npm.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scripts/directory-hub
          packageManager: pnpm
          command: d1 migrations apply DB --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scripts/directory-hub
          packageManager: pnpm
          command: deploy
