name: Measure Fastify 5 release image
on:
  push:
    branches: [codex/fastify5-linux-check]
    paths: [.github/workflows/verify-fastify5-linux.yml]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0d408ae177654e3850cf819076dda2c9f86c9e25
          persist-credentials: false
      - name: Build the amd64 release candidate locally
        run: docker build --platform linux/amd64 --build-arg BACKSPACE_COMMIT=0d408ae -t backspace:scan .
      - name: Run the exact release image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: backspace:scan
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Create images with synthetic package records
        run: |
          make_fixture() {
            name="$1"
            version="$2"
            fixture=$(mktemp -d)
            printf '{"name":"%s","version":"%s"}\n' "$name" "$version" > "$fixture/package.json"
            printf 'FROM backspace:scan\nCOPY package.json /gate-fixture/node_modules/%s/package.json\n' "$name" > "$fixture/Dockerfile"
            docker build -t "backspace:scan-$name" "$fixture"
          }
          make_fixture lodash 4.17.20
          make_fixture glob 11.1.0
      - name: Confirm the moderate fixture has a fixable finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: backspace:scan-glob
          ignore-unfixed: true
          format: json
          output: trivy-moderate.json
          severity: MEDIUM
      - name: Verify the moderate finding was detected
        run: jq -e 'any(.Results[].Vulnerabilities[]?; .PkgName == "glob" and .InstalledVersion == "11.1.0" and .Severity == "MEDIUM" and (.FixedVersion | length > 0))' trivy-moderate.json
      - name: Check that the release gate accepts the moderate fixture
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: backspace:scan-glob
          ignore-unfixed: true
          format: sarif
          output: trivy-glob.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Check that the same scan rejects the fixture
        id: fixture
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: backspace:scan-lodash
          ignore-unfixed: true
          format: sarif
          output: trivy-fixture.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Verify the expected fixture failure
        env:
          SCAN_OUTCOME: ${{ steps.fixture.outcome }}
        run: |
          test "$SCAN_OUTCOME" = failure
          jq -e 'any(.runs[].results[]; .ruleId == "CVE-2021-23337")' trivy-fixture.sarif
